<style>
#erd svg.classDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.classDiagram .row-rect-odd path,
#erd svg.classDiagram .row-rect-odd rect,
#erd svg.classDiagram .row-rect-even path,
#erd svg.classDiagram .row-rect-even rect { stroke: none !important; }
#erd svg.classDiagram .relation { stroke-width: 1.6px !important; }
#erd svg.classDiagram .edgeLabel rect { fill: var(--surface-1) !important; opacity: 1 !important; }
#erd svg.classDiagram .edgeLabel span, #erd svg.classDiagram .edgeLabel text { font-weight: 500 !important; }
#erd { overflow-x: auto; }
</style>
<h2 class="sr-only">Class diagram of an employee management system with explicit UML relationship types: composition, aggregation, and association, showing multiplicities on every link</h2>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '14px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#d8d6cc' : '#3d3d3a',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
  classDiagram: { useMaxWidth: false },
});
const src = `classDiagram
    direction TB
    class Employee {
        +UUID id
        +String firstName
        +String lastName
        +String email
        +Date dateOfHire
        +String status
    }
    class Department {
        +UUID id
        +String name
        +String location
    }
    class Role {
        +UUID id
        +String title
        +String level
    }
    class Address {
        +String street
        +String city
        +String country
    }
    class Salary {
        +UUID id
        +Decimal baseAmount
        +Decimal bonus
        +Date effectiveDate
    }
    class Attendance {
        +UUID id
        +Date date
        +Time checkIn
        +Time checkOut
    }
    class LeaveRequest {
        +UUID id
        +String type
        +Date startDate
        +Date endDate
        +String status
    }
    class Project {
        +UUID id
        +String name
        +Date startDate
        +String status
    }
    class ProjectAssignment {
        +UUID id
        +Int allocationPercent
        +String role
    }
    class PerformanceReview {
        +UUID id
        +String period
        +Int rating
    }
    class UserAccount {
        +UUID id
        +String username
        +String passwordHash
        +String role
    }

    Employee "1" *-- "1" Address : has
    Employee "1" *-- "1" Salary : has
    Department "1" o-- "N" Employee : employs
    Department "1" --> "N" Project : owns
    Department "1" --> "0..1" Employee : managed by
    Employee "N" --> "1" Role : holds
    Employee "1" --> "0..1" Employee : reports to
    Employee "1" --> "N" Attendance : logs
    Employee "1" --> "N" LeaveRequest : submits
    Employee "1" --> "N" PerformanceReview : receives
    Employee "1" --> "0..1" UserAccount : authenticates as
    Employee "1" --> "N" ProjectAssignment : assigned via
    Project "1" --> "N" ProjectAssignment : staffed via`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.classDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg.classDiagram .row-rect-odd path, #erd svg.classDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
